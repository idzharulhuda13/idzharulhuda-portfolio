<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img">
  <title>Dataverse conversational AI analytics: uploaded dataset through specialist agents to SQL and chart</title>
  <defs>
    <marker id="dv-arrow" viewBox="0 0 6 6" refX="6" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0.5L6 3L0 5.5Z" fill="var(--muted)"/>
    </marker>
    <marker id="dv-arrowGreen" viewBox="0 0 6 6" refX="6" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0.5L6 3L0 5.5Z" fill="var(--signal)"/>
    </marker>
  </defs>
  <style data-arch-theme="1">
    /* Standalone fallback for image-element rendering: mirrors the Instrument
       Sheet tokens declared in styles.css :root. Stripped when script.js
       inlines this SVG into the page, so page tokens take over there. */
    :root {
      --ground: #F2F1EC;
      --surface: #FFFFFF;
      --ink: #10130F;
      --muted: #5F6663;
      --line: #D3D5D0;
      --signal: #C2410C;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ground: #07090A;
        --surface: #101315;
        --ink: #EDEFEC;
        --muted: #98A09C;
        --line: #232829;
        --signal: #FF5A1F;
      }
    }
  </style>
  <g font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace">
    <rect x="0" y="0" width="880" height="420" rx="6" fill="var(--surface)"/>

    <path d="M214 210H238" stroke="var(--muted)" fill="none" marker-end="url(#dv-arrow)"/>
    <path d="M428 210H452" stroke="var(--muted)" fill="none" marker-end="url(#dv-arrow)"/>
    <path d="M642 210H666" stroke="var(--signal)" fill="none" marker-end="url(#dv-arrowGreen)"/>

    <rect x="24" y="178" width="190" height="64" rx="4" fill="var(--surface)" stroke="var(--line)"/>
    <text x="119" y="215" font-size="13" fill="var(--ink)" text-anchor="middle">user question</text>

    <rect x="238" y="178" width="190" height="64" rx="4" fill="var(--surface)" stroke="var(--line)"/>
    <text x="333" y="204" font-size="13" fill="var(--ink)" text-anchor="middle">upload</text>
    <text x="333" y="224" font-size="11" fill="var(--muted)" text-anchor="middle">CSV / Excel / Parquet</text>

    <rect x="452" y="65" width="190" height="290" rx="4" fill="var(--surface)" stroke="var(--line)"/>
    <text x="547" y="104" font-size="13" fill="var(--ink)" text-anchor="middle">5 specialist agents</text>
    <rect x="466" y="127" width="162" height="32" rx="3" fill="var(--ground)" stroke="var(--line)"/>
    <text x="547" y="146" font-size="11" fill="var(--ink)" text-anchor="middle">orchestrator</text>
    <rect x="466" y="170" width="162" height="32" rx="3" fill="var(--ground)" stroke="var(--line)"/>
    <text x="547" y="189" font-size="11" fill="var(--ink)" text-anchor="middle">cleaning agent</text>
    <rect x="466" y="213" width="162" height="32" rx="3" fill="var(--ground)" stroke="var(--line)"/>
    <text x="547" y="232" font-size="11" fill="var(--ink)" text-anchor="middle">enrichment agent</text>
    <rect x="466" y="256" width="162" height="32" rx="3" fill="var(--ground)" stroke="var(--line)"/>
    <text x="547" y="275" font-size="11" fill="var(--ink)" text-anchor="middle">SQL generation agent</text>
    <rect x="466" y="299" width="162" height="32" rx="3" fill="var(--ground)" stroke="var(--line)"/>
    <text x="547" y="318" font-size="11" fill="var(--ink)" text-anchor="middle">visualization agent</text>

    <rect x="666" y="178" width="190" height="64" rx="4" fill="var(--surface)" stroke="var(--line)"/>
    <text x="761" y="204" font-size="13" fill="var(--ink)" text-anchor="middle">result</text>
    <text x="761" y="224" font-size="11" fill="var(--muted)" text-anchor="middle">SQL + chart</text>

  </g>
</svg>
