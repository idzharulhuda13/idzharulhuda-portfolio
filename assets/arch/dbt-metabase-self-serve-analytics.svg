<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img">
  <title>dbt and Metabase self-serve analytics: source data through the dbt layers to dashboards</title>
  <defs>
    <marker id="dbt-arrow" viewBox="0 0 6 6" refX="6" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0.5L6 3L0 5.5Z" fill="var(--muted)"/>
    </marker>
  </defs>
  <style data-arch-theme="1">
    /* Standalone fallback for image-element rendering: mirrors the Instrument
       Sheet tokens declared in styles.css :root. Stripped when script.js
       inlines this SVG into the page, so page tokens take over there. */
    :root {
      --ground: #F2F1EC;
      --surface: #FFFFFF;
      --ink: #10130F;
      --muted: #5F6663;
      --line: #D3D5D0;
      --signal: #C2410C;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ground: #07090A;
        --surface: #101315;
        --ink: #EDEFEC;
        --muted: #98A09C;
        --line: #232829;
        --signal: #FF5A1F;
      }
    }
  </style>
  <g font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace">
    <rect x="0" y="0" width="880" height="420" rx="6" fill="var(--surface)"/>

    <path d="M651.5 121V182" stroke="var(--muted)" stroke-width="1" fill="none"/>
    <text x="651.5" y="118" font-size="11" fill="var(--signal)" text-anchor="middle">reports moved from daily to hourly generation</text>

    <path d="M151 210H165" stroke="var(--muted)" fill="none" marker-end="url(#dbt-arrow)"/>
    <path d="M292 210H306" stroke="var(--muted)" fill="none" marker-end="url(#dbt-arrow)"/>
    <path d="M433 210H447" stroke="var(--muted)" fill="none" marker-end="url(#dbt-arrow)"/>
    <path d="M574 210H588" stroke="var(--muted)" fill="none" marker-end="url(#dbt-arrow)"/>
    <path d="M715 210H729" stroke="var(--muted)" fill="none" marker-end="url(#dbt-arrow)"/>

    <rect x="24" y="182" width="127" height="56" rx="4" fill="var(--surface)" stroke="var(--line)"/>
    <text x="87.5" y="204" font-size="13" fill="var(--ink)" text-anchor="middle">sources</text>
    <text x="87.5" y="224" font-size="11" fill="var(--muted)" text-anchor="middle">Sheets reports</text>

    <rect x="165" y="182" width="127" height="56" rx="4" fill="var(--surface)" stroke="var(--line)"/>
    <text x="228.5" y="204" font-size="13" fill="var(--ink)" text-anchor="middle">staging</text>
    <text x="228.5" y="224" font-size="11" fill="var(--muted)" text-anchor="middle">raw models</text>

    <rect x="306" y="182" width="127" height="56" rx="4" fill="var(--surface)" stroke="var(--line)"/>
    <text x="369.5" y="204" font-size="13" fill="var(--ink)" text-anchor="middle">intermediate</text>
    <text x="369.5" y="224" font-size="11" fill="var(--muted)" text-anchor="middle">cleaned models</text>

    <rect x="447" y="182" width="127" height="56" rx="4" fill="var(--surface)" stroke="var(--line)"/>
    <text x="510.5" y="204" font-size="13" fill="var(--ink)" text-anchor="middle">marts</text>
    <text x="510.5" y="224" font-size="11" fill="var(--muted)" text-anchor="middle">business models</text>

    <rect x="588" y="182" width="127" height="56" rx="4" fill="var(--surface)" stroke="var(--line)"/>
    <text x="651.5" y="204" font-size="13" fill="var(--ink)" text-anchor="middle">Metabase</text>
    <text x="651.5" y="224" font-size="11" fill="var(--muted)" text-anchor="middle">dashboards</text>

    <rect x="729" y="182" width="127" height="56" rx="4" fill="var(--surface)" stroke="var(--line)"/>
    <text x="792.5" y="204" font-size="13" fill="var(--ink)" text-anchor="middle">stakeholders</text>
    <text x="792.5" y="224" font-size="11" fill="var(--muted)" text-anchor="middle">40+ self-serve</text>

    <path d="M165 238V290H574V238" stroke="var(--muted)" fill="none"/>
    <text x="369.5" y="308" font-size="11" fill="var(--muted)" text-anchor="middle">dbt tests + automated data quality checks</text>

    <path d="M588 238V290H856V238" stroke="var(--muted)" fill="none"/>
    <text x="722" y="308" font-size="11" fill="var(--muted)" text-anchor="middle">self-serve</text>

  </g>
</svg>
