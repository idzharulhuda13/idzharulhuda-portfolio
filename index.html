<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Analytics Engineer Portfolio</title>
  <meta name="description" id="page-meta" content="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <a href="#hero" class="logo" id="nav-logo">&gt; </a>
    <div class="nav-links">
      <a href="#about">About</a>
      <a href="#metrics">Impact</a>
      <a href="#projects">Projects</a>
      <a href="#experience">Experience</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <!-- Hero Section -->
  <section id="hero" class="hero">
    <canvas id="particle-canvas"></canvas>
    <div class="hero-content">
      <p class="hero-prefix">Hi, I'm</p>
      <h1 class="hero-name" id="hero-name"></h1>
      <h2 class="hero-title">
        I'm a <span class="accent"><span id="typed-output"></span></span>
      </h2>
      <p class="hero-desc" id="hero-desc"></p>
      <div class="hero-cta">
        <a href="#projects" class="btn btn-primary">View My Work</a>
        <a href="#contact" class="btn btn-secondary">Get In Touch</a>
      </div>
    </div>
    <div class="scroll-indicator">
      <span>Scroll</span>
      <div class="scroll-arrow"></div>
    </div>
  </section>

  <!-- About Section -->
  <section id="about" class="about">
    <div class="container">
      <h2 class="section-title"><span class="accent">&gt;</span> About</h2>
      <div class="about-content" id="about-content"></div>
      <div class="about-details" id="about-details"></div>
    </div>
  </section>

  <!-- Metrics / Impact Section -->
  <section id="metrics" class="metrics">
    <div class="container">
      <h2 class="section-title"><span class="accent">&gt;</span> Impact</h2>
      <div class="metrics-grid" id="metrics-grid"></div>
      <div class="charts-row" id="charts-row"></div>
    </div>
  </section>

  <!-- Projects Section -->
  <section id="projects" class="projects">
    <div class="container">
      <h2 class="section-title"><span class="accent">&gt;</span> Projects</h2>
      <div class="projects-grid" id="projects-grid"></div>
    </div>
  </section>

  <!-- Experience Section -->
  <section id="experience" class="experience">
    <div class="container">
      <h2 class="section-title"><span class="accent">&gt;</span> Experience</h2>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>

  <!-- Skills Section -->
  <section id="skills" class="skills">
    <div class="container">
      <h2 class="section-title"><span class="accent">&gt;</span> Tech Stack</h2>
      <div class="skills-grid" id="skills-grid"></div>
    </div>
  </section>

  <!-- Contact Section -->
  <section id="contact" class="contact">
    <div class="container">
      <h2 class="section-title"><span class="accent">&gt;</span> <span id="contact-heading"></span></h2>
      <p class="contact-desc" id="contact-desc"></p>
      <div class="contact-links" id="contact-links"></div>
    </div>
  </section>

  <footer>
    <p id="footer-text"></p>
  </footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
